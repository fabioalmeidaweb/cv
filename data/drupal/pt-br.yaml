about:
  label: Sobre mim
  values:
    - Engenheiro Drupal sênior com mais de 11 anos de experiência, focado em arquitetura, módulos e temas customizados, integrações com APIs e otimização de performance e segurança. Experiência com Drupal desacoplado usando GatsbyJS e React, e com projetos multisite na Acquia Cloud e Acquia Site Factory.
    - Atua também no front-end com React e TypeScript e usa IA agêntica no dia a dia, com workflows em Claude Code, Codex, Pi e MCP que automatizam a correção de bugs do ticket ao PR. Atua como desenvolvedor e Tech Lead, com experiência liderando times globais.

