experience:
  label: Experiência Profissional
  values:
    - company: NTConsult Corp
      position: Engenheiro Full Stack Sênior
      start: Jun 2023
      end: Present
      where: Remoto
      projects:
        - name: Plataforma SaaS para o Agronegócio
          description:
            - Criou workflows agênticos agnósticos de ferramenta (Claude Code, Codex, Pi) com integrações MCP (Jira, Confluence, Figma), automatizando a correção de bugs do ticket até o PR com subagentes em paralelo e code review automatizado no CI, reduzindo em mais de 50% o tempo médio de correção
            - Desenvolveu e manteve plataforma de gestão usada em 30 países e mais de 3,7 mil granjas, em React e TypeScript, com Redux Toolkit, Tailwind CSS e design system próprio, incluindo dashboards com Highcharts, relatórios exportáveis, i18n, testes com Jest e Playwright e APIs BFF em NestJS
        - name: Sistema de Regras de Pagamento para Planos de Saúde
          description:
            - Desenvolveu o front-end de monitoramento do ETL de um motor de regras que governa pagamentos, com Next.js, React 19, TypeScript e design system de mais de 50 componentes no Storybook, incluindo dashboards de conformidade e performance, edição de regras e histórico de alterações
            - Estruturou a aplicação em camadas (UI kit, componentes de domínio, páginas, hooks e serviços), com estado de servidor em TanStack Query, estado de cliente em Zustand, autenticação Azure AD (OAuth 2.0) e testes com Vitest
        - name: Startup de Farmácia Online e Telemedicina
          description:
            - Integrou Drupal com GatsbyJS e construiu aplicações React com Redux e Redux-Saga para sites dinâmicos de alta performance
            - Liderou times de até 5 desenvolvedores, aplicando boas práticas e garantindo entregas de alta qualidade
