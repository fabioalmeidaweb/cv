about:
  label: Sobre mim
  values:
    - Desenvolvedor front-end com mais de 11 anos de experiência, especializado em criar interfaces modernas, responsivas e de alta performance com ReactJS, TypeScript e JavaScript. Possui expertise avançada em gerenciamento de estado com Redux e Zustand, construção de aplicações escaláveis e componentização reutilizável com foco em experiência do usuário.
    - Domina Server-Side Rendering (SSR) e Static Site Generation (SSG) com Next.js e GatsbyJS, com sólida experiência em otimização de performance, acessibilidade (WCAG 2.1 AA) e Core Web Vitals. Capacidade comprovada de liderar equipes técnicas, implementar design systems com Storybook e garantir a entrega de aplicações robustas seguindo as melhores práticas de desenvolvimento front-end.

