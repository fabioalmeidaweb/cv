about:
  label: Sobre mim
  values:
    - Engenheiro front-end sênior com mais de 11 anos de experiência, especializado em React e TypeScript. Constrói plataformas SaaS com Redux Toolkit, Tailwind CSS e design systems, incluindo dashboards de dados, internacionalização e testes com Jest e Playwright, além de APIs BFF em NestJS.
    - Experiência em SSR e SSG com Next.js (App Router e Server Components) e GatsbyJS, performance, acessibilidade (WCAG 2.1 AA) e Core Web Vitals. Usa IA agêntica no dia a dia, com workflows em Claude Code, Codex, Pi e MCP que automatizam a correção de bugs do ticket ao PR. Atua como desenvolvedor e Tech Lead.

