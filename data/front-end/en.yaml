about:
  label: About Me
  values:
    - Front-end developer with over 11 years of experience, specializing in building modern, responsive, and high-performance interfaces with ReactJS, TypeScript, and JavaScript. Possesses advanced expertise in state management with Redux and Zustand, building scalable applications and reusable componentization with a focus on user experience.
    - Masters Server-Side Rendering (SSR) and Static Site Generation (SSG) with Next.js and GatsbyJS, with solid experience in performance optimization, accessibility (WCAG 2.1 AA), and Core Web Vitals. Proven ability to lead technical teams, implement design systems with Storybook, and ensure delivery of robust applications following front-end development best practices.

