experience:
  label: Experiência Profissional
  values:
    - company: NTConsult Corp
      position: Engenheiro Full Stack Sênior
      start: Jun 2023
      end: Present
      where: Remoto
      projects:
        - name: Plataforma SaaS para o Agronegócio
          description:
            - Criou workflows agênticos agnósticos de ferramenta (Claude Code, Codex, Pi) com integrações MCP (Jira, Confluence, Figma), automatizando a correção de bugs do ticket até o PR com subagentes em paralelo e code review automatizado no CI, reduzindo em mais de 50% o tempo médio de correção
            - Desenvolveu e manteve plataforma de gestão usada em 30 países e mais de 3,7 mil granjas, em React e TypeScript, com Redux Toolkit, Tailwind CSS e design system próprio, incluindo dashboards com Highcharts, relatórios exportáveis, i18n e testes com Jest e Playwright
            - Desenvolveu APIs BFF em Node.js com NestJS agregando até 5 microsserviços, com autenticação JWT, Swagger, PostgreSQL e Redis, além de CI/CD com Docker, GitHub Actions e GCP
        - name: Painel de Monitoramento ETL
          description:
            - Desenvolveu o front-end de monitoramento com React, Shadcn UI e Tailwind CSS, com gráficos interativos de séries temporais em Recharts
        - name: Drupal + GatsbyJS
          description:
            - Integrou Drupal com GatsbyJS e construiu aplicações React com Redux e Redux-Saga para sites dinâmicos de alta performance
            - Liderou times de até 5 desenvolvedores, aplicando boas práticas e garantindo entregas de alta qualidade
