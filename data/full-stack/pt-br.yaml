about:
  label: Sobre mim
  values:
    - Engenheiro full stack sênior com mais de 11 anos de experiência, especializado em TypeScript, React e Node.js. Atua de ponta a ponta em plataformas SaaS, de interfaces com React e Redux Toolkit a APIs Backend-for-Frontend com NestJS integrando microsserviços, PostgreSQL e Redis, além de CI/CD com Docker, GitHub Actions e GCP.
    - Incorpora IA agêntica ao ciclo de desenvolvimento, criando workflows com Claude Code, Codex, Pi e MCP que automatizam a correção de bugs do ticket ao PR. Tem experiência também com Next.js, GatsbyJS e Drupal, atuando como desenvolvedor e Tech Lead.

