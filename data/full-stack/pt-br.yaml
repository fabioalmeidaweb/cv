        - Conduziu análises e orientou a equipe na melhoria dos Core Web Vitals, alcançando scores 90+ em Performance, Acessibilidade e SEO
        - Liderou iniciativas de acessibilidade e implementação de conformidade ADA/WCAG 2.1 AA em mais de 10 sites de clientes
        - Gerenciou e realizou deploy de mais de 20 projetos multisite na Acquia Cloud e Acquia Site Factory
